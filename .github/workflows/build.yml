name: gateway

on:
  pull_request:
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build.yml"
  push:
    branches: [main]
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build.yml"

concurrency:
  group: gateway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore gateway.csproj
      - run: dotnet build gateway.csproj --configuration Release --no-restore

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/denissiusmaximus/posts-gateway
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=posts-gateway
          cache-to: type=gha,mode=max,scope=posts-gateway
          provenance: mode=max
          sbom: true

      - name: Trigger redeploy on VM
        run: |
          curl --fail-with-body --retry 3 --retry-delay 5 --max-time 15 -sS -X POST "${{ secrets.WEBHOOK_URL }}" \
            -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET }}"